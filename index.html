<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Online Service Center</title>
<style>
  * {
    box-sizing: border-box;
  }
  body { 
    font-family: Arial, sans-serif; 
    margin: 0; 
    padding: 0; 
    background-color: #e6f7ff;
    color: #00334e;
    padding-bottom: 40px;
    overflow-x: hidden;
  }
  header { 
    background-color: #87cefa;
    color: #002b49; 
    padding: 30px 15px; 
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  header h1 { 
    font-size: 32px; 
    margin: 0; 
    letter-spacing: 0.8px;
    text-transform: uppercase;
    line-height: 1.25;
  }
  header .tagline { 
    font-size: 20px; 
    margin-top: 8px; 
    margin-bottom: 18px;
    font-weight: bold;
    color: #004d7a;
  }
  .contact-box {
    background-color: rgba(255, 255, 255, 0.9);
    display: block;
    margin: 0 auto;
    padding: 18px 20px;
    border-radius: 12px;
    border: 1px solid #5bc0de;
    max-width: 560px;
  }
  .contact-box p {
    margin: 7px 0;
    font-size: 16px;
    color: #002b49;
    font-weight: bold;
    line-height: 1.45;
  }
  .qr-section {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px dashed #5bc0de;
  }
  .qr-grid {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .qr-card {
    background: #ffffff;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #b3e5fc;
    flex: 1 1 160px;
    max-width: 190px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .qr-card img {
    width: 136px;
    height: 136px;
    max-width: 100%;
    border: 3px solid #f0f9ff;
    border-radius: 6px;
    background: #fff;
  }
  .qr-label {
    font-size: 14px;
    font-weight: bold;
    margin: 8px 0 0 0;
    color: #00334e;
  }
  .qr-section > p {
    font-size: 14px;
    margin: 8px 0 12px 0;
    color: #004d7a;
  }
  .btn-group {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .whatsapp-btn, .map-btn, .review-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 150px;
    text-decoration: none;
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    min-height: 44px;
    transition: background-color 0.2s, transform 0.15s;
  }
  .whatsapp-btn {
    background-color: #25D366;
    color: #ffffff;
  }
  .whatsapp-btn:hover {
    background-color: #1ebe5d;
  }
  .map-btn {
    background-color: #0077b6;
    color: #ffffff;
  }
  .map-btn:hover {
    background-color: #005f87;
  }
  .review-btn {
    background-color: #f59e0b;
    color: #ffffff;
  }
  .review-btn:hover {
    background-color: #d97706;
  }
  .container { 
    max-width: 720px; 
    margin: 22px auto; 
    padding: 0 14px; 
  }
  .image-gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .image-card {
    background: white;
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 119, 182, 0.12);
    text-align: center;
  }
  .image-card img {
    width: 100%;
    height: 135px;
    object-fit: cover;
    border-radius: 6px;
  }
  .image-card span {
    display: block;
    margin-top: 8px;
    font-weight: bold;
    font-size: 14px;
    color: #005f87;
  }
  .services-list, .docs-box, .doc-check-box, .age-box, .insta-box, .wa-group-box, .footer-connect { 
    background: #ffffff; 
    border-radius: 12px; 
    padding: 22px 24px; 
    box-shadow: 0 4px 10px rgba(0, 119, 182, 0.1); 
    border-top: 5px solid #5bc0de;
    margin-bottom: 22px;
  }
  .age-box {
    border-top: 5px solid #0077b6;
  }
  .age-box h2 {
    text-align: center;
    color: #005f87;
    margin-top: 0;
    border-bottom: 2px solid #b3e5fc;
    padding-bottom: 12px;
    font-size: 22px;
  }
  .age-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    margin-top: 14px;
  }
  .age-form input[type="date"] {
    padding: 10px 12px;
    border: 2px solid #bae6fd;
    border-radius: 8px;
    font-size: 15.5px;
    color: #00334e;
    background: #f0f9ff;
    min-height: 44px;
  }
  .age-calc-btn {
    padding: 10px 18px;
    background-color: #0284c7;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    min-height: 44px;
  }
  .age-calc-btn:hover {
    background-color: #0369a1;
  }
  .age-result {
    margin-top: 16px;
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    font-size: 16.5px;
    font-weight: bold;
    color: #002b49;
    display: none;
  }
  .age-result.show {
    display: block;
  }
  .doc-check-box {
    border-top: 5px solid #0284c7;
  }
  .doc-check-box h2 {
    text-align: center;
    color: #005f87;
    margin-top: 0;
    border-bottom: 2px solid #b3e5fc;
    padding-bottom: 12px;
    font-size: 22px;
  }
  .doc-check-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  .doc-check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f0f9ff;
    border: 2px solid #bae6fd;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
    color: #00334e;
    transition: all 0.2s ease;
  }
  .doc-check-item:has(input:checked) {
    background: #e0f2fe;
    border-color: #0284c7;
    box-shadow: 0 2px 6px rgba(2, 132, 199, 0.18);
  }
  .doc-check-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #0284c7;
    cursor: pointer;
    flex-shrink: 0;
  }
  .doc-check-panel {
    display: none;
    margin-top: 14px;
    background: #f8fafc;
    border-left: 4px solid #0284c7;
    border-radius: 8px;
    padding: 14px 16px;
  }
  .doc-check-panel.active {
    display: block;
  }
  .doc-check-panel h4 {
    margin: 0 0 8px 0;
    color: #004d7a;
    font-size: 16.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .doc-check-panel ul {
    margin: 0;
    padding-left: 18px;
  }
  .doc-check-panel li {
    padding: 4px 0;
    font-size: 15px;
    color: #0f172a;
  }
  .wa-group-box {
    border-top: 5px solid #25D366;
    background: #f4fdf7;
  }
  .wa-group-box h2 {
    text-align: center;
    color: #15803d;
    margin-top: 0;
    border-bottom: 2px solid #bbf7d0;
    padding-bottom: 12px;
    font-size: 21px;
  }
  .wa-group-layout {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 18px;
    align-items: center;
    margin-top: 14px;
  }
  .wa-group-qr-card {
    background: #ffffff;
    border: 1px solid #86efac;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(21, 128, 61, 0.08);
  }
  .wa-group-qr-card img {
    width: 140px;
    height: 140px;
    max-width: 100%;
    border-radius: 6px;
  }
  .wa-group-qr-card p {
    margin: 6px 0 0 0;
    font-size: 13px;
    font-weight: bold;
    color: #166534;
  }
  .wa-group-info p {
    margin: 0 0 14px 0;
    font-size: 15.5px;
    line-height: 1.55;
    color: #1e293b;
  }
  .wa-group-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background-color: #25D366;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    min-height: 46px;
  }
  .wa-group-btn:hover {
    background-color: #1ebe5d;
  }
  .insta-box {
    border-top: 5px solid #e1306c;
    text-align: center;
  }
  .footer-connect {
    border-top: 5px solid #0077b6;
    text-align: center;
    margin-bottom: 0;
  }
  .footer-connect h2 {
    color: #004d7a;
    margin-top: 0;
    margin-bottom: 14px;
    font-size: 20px;
  }
  .bottom-actions {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .personal-insta-btn, .call-now-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 180px;
    gap: 8px;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    min-height: 46px;
  }
  .personal-insta-btn {
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  }
  .personal-insta-btn:hover {
    opacity: 0.92;
  }
  .call-now-btn {
    background-color: #0284c7;
  }
  .call-now-btn:hover {
    background-color: #0369a1;
  }
  .services-list h2, .docs-box h2, .insta-box h2 { 
    text-align: center; 
    color: #005f87; 
    margin-top: 0;
    border-bottom: 2px solid #b3e5fc;
    padding-bottom: 12px;
    font-size: 22px;
  }
  .insta-box h2 {
    color: #c13584;
    border-bottom-color: #fce7f3;
  }
  .insta-desc {
    font-size: 15.5px;
    color: #334155;
    margin: 10px 0 16px 0;
    line-height: 1.55;
  }
  .insta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    color: #ffffff;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    min-height: 46px;
    max-width: 100%;
    box-shadow: 0 3px 8px rgba(220, 39, 67, 0.3);
  }
  .insta-btn:hover {
    opacity: 0.92;
  }
  .frame-showcase {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 20px;
  }
  .frame-card {
    background: #fff5f7;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #fbcfe8;
    text-align: center;
    text-decoration: none;
    color: #831843;
    transition: transform 0.2s;
  }
  .frame-card:hover {
    transform: translateY(-3px);
  }
  .frame-mock {
    background: #ffffff;
    border: 6px solid #1e293b;
    box-shadow: inset 0 0 0 3px #f8fafc, 0 3px 6px rgba(0,0,0,0.15);
    border-radius: 4px;
    height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  .frame-mock.gold {
    border-color: #b45309;
    background: #fffbeb;
  }
  .frame-mock.rose {
    border-color: #be123c;
    background: #fff1f2;
  }
  .frame-card span {
    display: block;
    margin-top: 8px;
    font-weight: bold;
    font-size: 14px;
    color: #9d174d;
  }
  .services-list ul { 
    list-style-type: none; 
    padding: 0; 
    margin: 0;
  }
  .services-list li { 
    padding: 12px 10px; 
    border-bottom: 1px solid #e1f5fe; 
    font-size: 16.5px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .services-list li:last-child { 
    border-bottom: none; 
  }
  .services-list li::before {
    content: "✔";
    color: #0088cc;
    font-weight: bold;
    margin-right: 2px;
    flex-shrink: 0;
  }
  .service-logo {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .doc-group {
    margin-top: 18px;
  }
  .doc-group h3 {
    color: #004d7a;
    font-size: 18px;
    line-height: 1.4;
    margin-bottom: 10px;
    border-left: 4px solid #0088cc;
    padding-left: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .doc-group ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
  }
  .doc-group li {
    padding: 8px 10px;
    border-bottom: 1px solid #eef9ff;
    font-size: 15.5px;
    line-height: 1.5;
  }
  .doc-group li:last-child {
    border-bottom: none;
  }

  /* Mobile Responsive Adjustments */
  @media (max-width: 600px) {
    header {
      padding: 24px 12px;
    }
    header h1 {
      font-size: 24px;
    }
    header .tagline {
      font-size: 17px;
    }
    .contact-box {
      padding: 14px 14px;
    }
    .contact-box p {
      font-size: 14.5px;
    }
    .services-list, .docs-box, .doc-check-box, .age-box, .insta-box, .wa-group-box, .footer-connect {
      padding: 18px 15px;
    }
    .age-form input[type="date"],
    .age-calc-btn {
      width: 100%;
    }
    .doc-check-options {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .wa-group-layout {
      grid-template-columns: 1fr;
      text-align: center;
    }
    .wa-group-qr-card {
      margin: 0 auto;
      width: 170px;
    }
    .image-gallery {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .image-card img {
      height: 165px;
    }
    .frame-showcase {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .btn-group .whatsapp-btn,
    .btn-group .map-btn,
    .btn-group .review-btn {
      flex: 1 1 100%;
    }
    .bottom-actions .personal-insta-btn,
    .bottom-actions .call-now-btn {
      flex: 1 1 100%;
    }
    .services-list li {
      font-size: 15.5px;
      padding: 11px 6px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>DEEP ONLINE SERVICE CENTER</h1>
  <p class="tagline">Welcome To Digital World</p>
  
  <div class="contact-box">
    <p>📍 સરનામું: આછવણી, રજપૂત ફળિયા, રામેશ્વર મંદિર પાસે</p>
    <p>📞 સંપર્ક: 90239 94413</p>
    <p>🕒 સમય: સોમવારથી શનિવાર — સવારે 8:30 થી સાંજે 8:00</p>

    <div class="qr-section">
