<style>
  body { 
    font-family: Arial, sans-serif; 
    margin: 0; 
    padding: 0; 
    background-color: #e6f7ff; /* હળવો સ્કાય બ્લુ બેકગ્રાઉન્ડ */
    color: #00334e;
    padding-bottom: 40px;
  }
  header { 
    background-color: #87cefa; /* લાઇટ સ્કાય બ્લુ હેડર */
    color: #002b49; 
    padding: 35px 20px; 
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  header h1 { 
    font-size: 36px; 
    margin: 0; 
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header .tagline { 
    font-size: 22px; 
    margin-top: 8px; 
    margin-bottom: 18px;
    font-weight: bold;
    color: #004d7a;
  }
  .contact-box {
    background-color: rgba(255, 255, 255, 0.85);
    display: inline-block;
    padding: 15px 25px;
    border-radius: 10px;
    border: 1px solid #5bc0de;
    max-width: 90%;
  }
  .contact-box p {
    margin: 6px 0;
    font-size: 17px;
    color: #002b49;
    font-weight: bold;
  }
  .qr-section {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px dashed #5bc0de;
  }
  .qr-section img {
    width: 140px;
    height: 140px;
    border: 4px solid #ffffff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    background: #fff;
  }
  .qr-section p {
    font-size: 14px;
    margin: 8px 0 12px 0;
    color: #004d7a;
  }
  .btn-group {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .whatsapp-btn {
    display: inline-block;
    background-color: #25D366;
    color: #ffffff;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
  }
  .whatsapp-btn:hover {
    background-color: #1ebe5d;
  }
  .map-btn {
    display: inline-block;
    background-color: #0077b6;
    color: #ffffff;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
  }
  .map-btn:hover {
    background-color: #005f87;
  }
  .review-btn {
    display: inline-block;
    background-color: #f59e0b; /* રિવ્યુ માટે આકર્ષક ગોલ્ડન-ઓરેન્જ રંગ */
    color: #ffffff;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
  }
  .review-btn:hover {
    background-color: #d97706;
  }
  .container { 
    max-width: 700px; 
    margin: 25px auto; 
    padding: 0 15px; 
  }
  .image-gallery {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }
  .image-card {
    flex: 1;
    min-width: 190px;
    background: white;
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 119, 182, 0.12);
    text-align: center;
  }
  .image-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
  }
  .image-card span {
    display: block;
    margin-top: 6px;
    font-weight: bold;
    font-size: 14px;
    color: #005f87;
  }
  .services-list, .docs-box { 
    background: #ffffff; 
    border-radius: 10px; 
    padding: 25px 30px; 
    box-shadow: 0 4px 10px rgba(0, 119, 182, 0.1); 
    border-top: 5px solid #5bc0de;
    margin-bottom: 25px;
  }
  .services-list h2, .docs-box h2 { 
    text-align: center; 
    color: #005f87; 
    margin-top: 0;
    border-bottom: 2px solid #b3e5fc;
    padding-bottom: 12px;
  }
  .services-list ul { 
    list-style-type: none; 
    padding: 0; 
    margin: 0;
  }
  .services-list li { 
    padding: 12px 15px; 
    border-bottom: 1px solid #e1f5fe; 
    font-size: 18px;
    display: flex;
    align-items: center;
  }
  .services-list li:last-child { 
    border-bottom: none; 
  }
  .services-list li::before {
    content: "✔️";
    color: #0088cc;
    font-weight: bold;
    margin-right: 12px;
  }
  .doc-group {
    margin-top: 18px;
  }
  .doc-group h3 {
    color: #004d7a;
    font-size: 19px;
    margin-bottom: 10px;
    border-left: 4px solid #0088cc;
    padding-left: 10px;
  }
  .doc-group ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
  }
  .doc-group li {
    padding: 8px 12px;
    border-bottom: 1px solid #eef9ff;
    font-size: 16px;
  }
  .doc-group li:last-child {
    border-bottom: none;
  }
  .doc-note {
    font-size: 14px;
    color: #006699;
    font-style: italic;
  }
</style>
</head>
